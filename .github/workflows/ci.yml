name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------------------
      # Source code
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libboost-program-options-dev \
            nlohmann-json3-dev

      # ------------------------------------------------------------------------
      # ADIOS2
      # ------------------------------------------------------------------------
      - name: Set up ADIOS2
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: chisurfmd-ci
          create-args: >-
            -c conda-forge
            adios2
            cmake
            ninja

      # ------------------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------------------
      - name: Configure
        shell: micromamba-shell {0}
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -Dchisurfmd_PARTICLE=ParticleOriented \
            -Dchisurfmd_POTENTIAL=OrientedLJ \
            -Dchisurfmd_THERMOSTAT=ThermostatID::Andersen

      # ------------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------------
      - name: Build
        shell: micromamba-shell {0}
        run: |
          cmake --build build-ci

      # ------------------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------------------
      - name: Test
        shell: micromamba-shell {0}
        run: |
          ctest \
            --test-dir build-ci \
            --output-on-failure
